name: EV įkrovimo kainų atnaujinimas

on:
  schedule:
    - cron: '25 5,8,12,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ev-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Paimti failus
        uses: actions/checkout@v4

      - name: Paruošti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Įdiegti bibliotekas
        run: pip install requests beautifulsoup4

      - name: Surinkti EV stoteles, kainas ir sugeneruoti SEO
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python main.py

      - name: Išsaugoti ev_prices.json ir SEO puslapius
        run: |
          git config --local user.email "bot@ev-kainos-lt.vercel.app"
          git config --local user.name "EV Kainos Lietuvoje Robotas"
          git add ev_prices.json index.html tinklai/ miestai/ keliai/ sitemap.xml robots.txt
          git commit -m "Atnaujintos EV įkrovimo kainos ir SEO puslapiai" || exit 0
          git push
